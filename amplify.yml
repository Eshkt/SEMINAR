version: 1
applications:
  - frontend:
      runtime:
        name: nodejs
        version: 20
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - export VITE_API_URL="${VITE_API_URL}"
            - export VITE_ADMIN_PASS="${VITE_ADMIN_PASS}"
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - ~/.npm