version: 1
applications:
  - appRoot: frontend
    frontend:
      runtime:
        name: nodejs
        version: 20
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - export VITE_API_URL='https://eepdc4xkc4lm7mhiudfhbc3vvy0ismrz.lambda-url.ap-southeast-1.on.aws'
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - ~/.npm