version: 1
applications:
  - appRoot: frontend
    frontend:
      runtime:
        name: nodejs
        version: 20
      phases:
        preBuild:
          commands:
            - rm -rf dist
            - npm ci
        build:
          commands:
            - export VITE_API_URL="${VITE_API_URL}"
            - export VITE_ADMIN_PASS="${VITE_ADMIN_PASS}"
            - npm run build
            - echo "/* /index.html 200" > dist/_redirects
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - ~/.npm